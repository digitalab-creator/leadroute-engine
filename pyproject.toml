[tool.ruff]
target-version = "py313"
line-length = 100
src = ["backend"]

[tool.ruff.lint]
# Default Ruff rules: real bugs, not a restyle of the phase-1 modules.
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
strict = true
python_version = "3.13"
mypy_path = "backend"
packages = ["app"]
explicit_package_bases = true
